name: Executar Robô de Download Automático

on:
  schedule:
    # Roda automaticamente a cada 10 horas
    - cron: '0 */10 * * *'
  workflow_dispatch:
    inputs:
      url_manual:
        description: 'URL do jogo para testar/adicionar (Modyolo ou Modplays)'
        required: false
        default: ''

jobs:
  extrair:
    runs-on: ubuntu-latest
    # Permissão necessária para o bot do GitHub conseguir salvar/atualizar o jogos.txt
    permissions:
      contents: write

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      - name: Executar Robô
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GREEN_API_INSTANCE: ${{ secrets.GREEN_API_INSTANCE }}
          GREEN_API_TOKEN: ${{ secrets.GREEN_API_TOKEN }}
          GREEN_API_GROUP_ID: ${{ secrets.GREEN_API_GROUP_ID }}
        run: |
          if [ -n "${{ github.event.inputs.url_manual }}" ]; then
            python extrair.py "${{ github.event.inputs.url_manual }}"
          else
            python extrair.py
          fi

      - name: Salvar lista de jogos no repositório
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add jogos.txt || true
          git commit -m "Auto: Lista de jogos atualizada" || exit 0
          git push
