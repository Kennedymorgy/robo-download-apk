name: Robô Solo Indexação Google (24 Horas)

on:
  schedule:
    # Roda automaticamente 1 vez a cada 24 horas (03:00 da manhã UTC)
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  indexar_solo:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar Dependencias Leves
        run: |
          python -m pip install --upgrade pip
          pip install requests google-auth

      - name: Executar Indexador Solo
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          python indexador_solo.py
